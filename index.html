<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #eef2f7;
  margin: 0;
  padding: 25px;
  color: #263247;
}
.container {
  max-width: 1000px;
  margin: auto;
}
h1 { text-align: center; color: #2455a4; }
.cards, .charts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 20px 0;
}
.card, .panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0001;
}
.card h3 { margin-top: 0; font-size: 15px; }
.card p { font-size: 24px; font-weight: bold; }
.income { color: #15965b; }
.expense { color: #dc4545; }
.balance { color: #2455a4; }
input, select, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccd3df;
  border-radius: 7px;
}
button {
  background: #2455a4;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { opacity: .85; }
.edit { background: #e6a329; }
.delete { background: #dc4545; }
.cancel { background: #64748b; }
.transaction {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
.transaction small { display: block; color: #777; margin-top: 5px; }
.actions { display: flex; gap: 5px; }
.actions button { width: auto; padding: 8px; }
.charts { grid-template-columns: repeat(2, 1fr); }
.chart-box { min-height: 280px; }
@media(max-width:650px) {
  body { padding: 12px; }
  .cards, .charts { grid-template-columns: 1fr; }
  .transaction { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="container">
<h1>My Expense Tracker</h1>

<div class="cards">
  <div class="card">
    <h3>Total Income</h3>
    <p class="income" id="income">₹0</p>
  </div>
  <div class="card">
    <h3>Total Expenses</h3>
    <p class="expense" id="expense">₹0</p>
  </div>
  <div class="card">
    <h3>Remaining Balance</h3>
    <p class="balance" id="balance">₹0</p>
  </div>
</div>

<div class="panel">
<h2 id="formTitle">Add Transaction</h2>
<form id="transactionForm">
<input id="description" placeholder="Enter description" required>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount" required>
<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>
<button type="submit" id="saveButton">Add Transaction</button>
<button type="button" id="cancelButton" class="cancel" hidden onclick="cancelEdit()">Cancel Edit</button>
</form>
</div>

<div class="panel">
<h2>Monthly Expense Summary</h2>
<input type="month" id="monthFilter">
<h3>Monthly Income: <span class="income" id="monthlyIncome">₹0</span></h3>
<h3>Monthly Expenses: <span class="expense" id="monthlyExpense">₹0</span></h3>
<h3>Monthly Balance: <span id="monthlyBalance">₹0</span></h3>
</div>

<div class="panel">
<h2>Transaction History</h2>
<div id="history"></div>
</div>

<div class="charts">
<div class="panel chart-box">
<h2>Income vs Expense</h2>
<canvas id="pieChart"></canvas>
</div>
<div class="panel chart-box">
<h2>Monthly Overview</h2>
<canvas id="barChart"></canvas>
</div>
</div>
</div>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions") || "[]");
let editIndex = -1;
let pieChart, barChart;

const money = n => "₹" + n.toLocaleString("en-IN", {
  maximumFractionDigits: 2
});

function saveData() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
}

function addTransaction(event) {
  event.preventDefault();

  const description = document.getElementById("description").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const type = document.getElementById("type").value;

  if (!description || !Number.isFinite(amount) || amount <= 0) {
    alert("Please enter valid transaction details.");
    return;
  }

  if (editIndex >= 0) {
    transactions[editIndex] = {
      ...transactions[editIndex], description, amount, type
    };
  } else {
    transactions.push({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      description, amount, type,
      date: new Date().toISOString()
    });
  }

  saveData();
  cancelEdit();
  displayTransactions();
}

function editTransaction(index) {
  const item = transactions[index];
  document.getElementById("description").value = item.description;
  document.getElementById("amount").value = item.amount;
  document.getElementById("type").value = item.type;
  editIndex = index;
  document.getElementById("formTitle").textContent = "Edit Transaction";
  document.getElementById("saveButton").textContent = "Update Transaction";
  document.getElementById("cancelButton").hidden = false;
  document.getElementById("description").focus();
}

function cancelEdit() {
  editIndex = -1;
  document.getElementById("transactionForm").reset();
  document.getElementById("formTitle").textContent = "Add Transaction";
  document.getElementById("saveButton").textContent = "Add Transaction";
  document.getElementById("cancelButton").hidden = true;
}

function deleteTransaction(index) {
  if (!confirm("Delete this transaction?")) return;
  transactions.splice(index, 1);
  saveData();
  if (editIndex === index) cancelEdit();
  else if (editIndex > index) editIndex--;
  displayTransactions();
}

function displayTransactions() {
  const income = transactions.filter(t => t.type === "income")
    .reduce((sum, t) => sum + t.amount, 0);
  const expense = transactions.filter(t => t.type === "expense")
    .reduce((sum, t) => sum + t.amount, 0);

  document.getElementById("income").textContent = money(income);
  document.getElementById("expense").textContent = money(expense);
  document.getElementById("balance").textContent = money(income - expense);

  const history = document.getElementById("history");
  history.innerHTML = "";

  transactions.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = "transaction";

    const details = document.createElement("div");
    const name = document.createElement("strong");
    name.textContent = item.description;
    const amount = document.createElement("div");
    amount.className = item.type;
    amount.textContent = (item.type === "income" ? "+" : "-") + money(item.amount);
    const date = document.createElement("small");
    date.textContent = item.date
      ? new Date(item.date).toLocaleString()
      : "Date not available (old transaction)";

    details.append(name, amount, date);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Edit";
    edit.onclick = () => editTransaction(index);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Delete";
    del.onclick = () => deleteTransaction(index);

    actions.append(edit, del);
    row.append(details, actions);
    history.appendChild(row);
  });

  updateMonthlySummary();
  updateCharts();
}

function updateMonthlySummary() {
  const month = document.getElementById("monthFilter").value;
  const selected = transactions.filter(t =>
    t.date && t.date.slice(0, 7) === month
  );

  const income = selected.filter(t => t.type === "income")
    .reduce((s, t) => s + t.amount, 0);
  const expense = selected.filter(t => t.type === "expense")
    .reduce((s, t) => s + t.amount, 0);

  document.getElementById("monthlyIncome").textContent = money(income);
  document.getElementById("monthlyExpense").textContent = money(expense);
  document.getElementById("monthlyBalance").textContent = money(income - expense);
}

function updateCharts() {
  const income = transactions.filter(t => t.type === "income")
    .reduce((s, t) => s + t.amount, 0);
  const expense = transactions.filter(t => t.type === "expense")
    .reduce((s, t) => s + t.amount, 0);

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: {
      labels: ["Income", "Expense"],
      datasets: [{ data: [income, expense], backgroundColor: ["#16a36a", "#e34b4b"] }]
    },
    options: { responsive: true, maintainAspectRatio: true }
  });

  const monthly = {};
  transactions.forEach(t => {
    if (!t.date) return;
    const month = t.date.slice(0, 7);
    if (!monthly[month]) monthly[month] = { income: 0, expense: 0 };
    monthly[month][t.type] += t.amount;
  });

  const labels = Object.keys(monthly).sort();
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "Income", data: labels.map(m => monthly[m].income), backgroundColor: "#16a36a" },
        { label: "Expense", data: labels.map(m => monthly[m].expense), backgroundColor: "#e34b4b" }
      ]
    },
    options: { responsive: true, maintainAspectRatio: true }
  });
}

document.getElementById("transactionForm")
  .addEventListener("submit", addTransaction);
document.getElementById("monthFilter").addEventListener("change", updateMonthlySummary);

document.getElementById("monthFilter").value =
  new Date().toISOString().slice(0, 7);

displayTransactions();
</script>
</body>
</html>
